[project]
name = "uncalledfor-api"
version = "0.1.0"
description = "A high-performance FastAPI web application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siddhesh Tawde", email = "siddheshtawde35@gmail.com" }]
dependencies = [
    "fastapi[standard]>=0.115.0", # Includes Uvicorn and FastAPI CLI
    "pydantic>=2.0.0",            # Data validation
    "pydantic-settings>=2.0.0",   # Environment configuration management
    "clerk-backend-api>=7.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "groq>=1.7.0",
]

[project.optional-dependencies]
# Extra dependencies grouped by feature
database = [
    "alembic>=1.12.0",
]

[dependency-groups]
# Development dependencies (Standardized for tools like uv)
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",          # Needed for Testing FastAPI endpoints
    "ruff>=0.3.0",            # Ultra-fast Linter and Formatter
    "mypy>=1.9.0",            # Static Type Checker
]
