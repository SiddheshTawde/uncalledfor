<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101210" />
    <meta name="description" content="The Uncalled For API. Clerk-authenticated access." />
    <meta name="robots" content="index, follow" />
    <title>Uncalled For API</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Uncalled For" />
    <meta property="og:title" content="Uncalled For API" />
    <meta property="og:description" content="The Uncalled For API. Clerk-authenticated access." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Uncalled For API" />
    <meta name="twitter:description" content="The Uncalled For API. Clerk-authenticated access." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="favicon.ico">
    <style>
      :root {
        color-scheme: dark;
        font-family: "Manrope", sans-serif;
        color: #eeeff4;
        background: #111114;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ink: #f0f1e9;
        --muted: #92929d;
        --line: #2a2a31;
        --indigo: #9297ff;
        --mono: "DM Mono", monospace;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #111114;
      }

      a { color: inherit; }

      .shell {
        width: min(760px, calc(100% - 48px));
        margin: 0 auto;
      }

      .topbar {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .docs-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #c4c4ce;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        transition: color 160ms ease;
      }

      .docs-link:hover, .footer-link:hover { color: var(--indigo); }

      main { padding: 88px 0 84px; }

      .eyebrow {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--indigo);
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 6vw, 52px);
        font-weight: 500;
        line-height: 1.12;
        letter-spacing: 0;
      }

      h1 span { color: var(--indigo); }

      .intro-copy {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      @media (max-width: 700px) {
        .shell { width: calc(100% - 40px); }
        main { padding: 68px 0 64px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="wordmark" href="/">uncalledfor</a>
        <a class="docs-link" href="/docs/">API docs <span aria-hidden="true">↗</span></a>
      </header>

      <main>
        <p class="eyebrow">API / VERSION 1</p>
        <h1 id="page-title">Uncalled for <span>API</span></h1>
        <p class="intro-copy">Clerk authentication required.</p>
      </main>
    </div>
  </body>
</html>
